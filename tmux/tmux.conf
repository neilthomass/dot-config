# Mouse support
set -g mouse on

# Split panes with - and =
bind - split-window -v -c "#{pane_current_path}"
bind = split-window -h -c "#{pane_current_path}"

# Navigate panes with hjkl and arrows
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R


#reload
bind r source-file ~/.tmux.conf \; display "reloaded"

# Resize panes with Ctrl+hjkl
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer
set -g history-limit 50000

# Faster key repetition
set -s escape-time 0

# Enable focus events for vim/neovim
set -g focus-events on

# Better colors
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Reload config with prefix-r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Kill pane without confirmation
bind x kill-pane

# Kill window without confirmation
bind X kill-window

# Easy window navigation
bind -r n next-window
bind -r p previous-window

# Create new window in current path
bind c new-window -c "#{pane_current_path}"

# ──────────────────────────────────────────────────────────────
# Plugins (TPM)
# ──────────────────────────────────────────────────────────────
# Homebrew's tmux lives in /opt/homebrew/bin; tmux's run-shell uses a minimal
# PATH that doesn't include it, which breaks TPM's path lookup.
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Initialize TPM (keep at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
